# Ekrany modułu w panelu silnika.
#
# _legacy_controller wskazuje zakładkę silnika, bo moduł bez niego i tak nie działa
# (zadeklarowana zależność). Uprawnienia PrestaShop sprawdza więc na zakładce silnika.
#
# Dziennik ma osobną trasę, bo jego stronicowanie i filtry muszą mieścić się
# w adresie. Inaczej nie da się wrócić do tej samej strony wyników ani wysłać jej komuś.

quince_omnibus_settings:
  path: quince/omnibus
  methods: [GET]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\SettingsController::indexAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_omnibus_settings_save:
  path: quince/omnibus/save
  methods: [POST]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\SettingsController::saveAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_omnibus_token:
  path: quince/omnibus/token
  methods: [POST]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\SettingsController::tokenAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_omnibus_log:
  path: quince/omnibus/log
  methods: [GET]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\LogController::indexAction
