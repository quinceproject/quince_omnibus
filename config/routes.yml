  methods: [POST]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\LogController::deleteAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:delete'

quince_omnibus_log_clean:
  path: quince/omnibus/log/clean
  methods: [POST]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\LogController::cleanAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:delete'

quince_omnibus_log_record_all:
  path: quince/omnibus/log/record-all
  methods: [POST]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\LogController::recordAllAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'

quince_omnibus_log_export:
  path: quince/omnibus/log/export
  methods: [GET]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\LogController::exportAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince'

quince_omnibus_log_import:
  path: quince/omnibus/log/import
  methods: [POST]
  defaults:
    _controller: Quince\Omnibus\Controller\Admin\LogController::importAction
    _legacy_controller: 'AdminQuince'
    _legacy_link: 'AdminQuince:save'
